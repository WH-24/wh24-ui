name: Publish to GitHub Packages

# Триггер:
# - на push тега вида v* (например v0.1.0, v1.2.3) — публикуется
#   ВСЕ пакеты с такой версией. Для индивидуальной версии пакета
#   используем тег vида @wowhaus-24/ui-react@0.2.0 (см. ниже).
on:
  push:
    tags:
      - 'v*'
      - '@wowhaus-24/*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@wowhaus-24'

      - name: Install
        # `npm install` (не `npm ci`): wh-ui обычно разрабатывается из
        # workspace в deploy/ — package-lock.json там, а не в репо.
        # Для CI этого пакета свежий resolve нормален.
        run: npm install

      - name: Build all packages
        # Используем per-workspace build (не root `tsc -b`) — root
        # build запускает только tsc через project references,
        # а нам нужен ещё и postbuild (copy-css.mjs), который
        # выполняется как часть npm script "build" в packages/react.
        run: npm run build --workspaces --if-present

      - name: Publish @wowhaus-24/ui-tokens
        # Публикуем только если pkg.version из tokens соответствует тегу
        # (или если пакет ещё не опубликован — npm publish ругнётся 409
        # на дубликат, что мы игнорируем для удобства re-runs).
        run: |
          cd packages/tokens
          npm publish || echo "tokens already published at this version"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @wowhaus-24/ui-react
        run: |
          cd packages/react
          npm publish || echo "react already published at this version"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI

on:
  push:
    branches: [main]
    # Docs-коммиты в main не гоняют проверки (PR-проверки не трогаем).
    paths-ignore:
      - '**.md'
      - 'docs/**'

  pull_request:
    branches: [main]

permissions:
  contents: read

# Новый пуш в ту же ветку отменяет предыдущий прогон — досчитывать
# заведомо устаревший смысла нет.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

name: Security Scan

on:
  pull_request:
  push:
    branches: [main]
    # Docs-коммиты в main не гоняют проверки (PR-проверки не трогаем).
    paths-ignore:
      - '**.md'
      - 'docs/**'

  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

# Новый пуш в ту же ветку отменяет предыдущий прогон — досчитывать
# заведомо устаревший смысла нет.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: npm audit (high+)
        run: npm audit --audit-level=high
        # не блокируем сборку на транзитивных low/moderate; high/critical — сигнал

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect \
            --source=/repo --no-banner --redact --exit-code=1

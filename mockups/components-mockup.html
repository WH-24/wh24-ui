<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body style="margin:0">
<title>Компоненты wh24-ui</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Раскладка: оболочка портала — верхняя полоса, слева панель модуля, справа страница. Уже 900px панель становится полосой вкладок. */
:root{
  --terra:#dd6731;--terra-solid:#b8501f;--terra-solid-hover:#9e4419;--terra-text:#a8481b;--terra-bg:#fbeee5;--terra-bd:#e89971;
  --ink:#1a1a1a;--ink-2:#3d3d3d;--ink-3:#5c5c5c;--ink-4:#b4b2a9;
  --bd:rgba(0,0,0,.08);--bd-soft:rgba(0,0,0,.05);--bd-strong:rgba(0,0,0,.14);--field-bd:rgba(0,0,0,.44);
  --bg:#fafaf7;--surf:#fff;--surf-2:#f7f5f0;--surf-3:#efece4;
  --good:#3f7a1a;--good-bg:#eef6e3;--warn:#8a5a12;--warn-bg:#faecd6;--info:#2c5687;--info-bg:#eef3f9;--art:#3c3489;--art-bg:#eeedfe;
  --bad:#a32d2d;--bad-bg:#fceaea;--bad-bd:#e6a8a8;--bad-strong:#a32d2d;--good-strong:#3f7a1a;
  --scrim:rgba(20,18,14,.42);--sh-sm:0 1px 2px rgba(0,0,0,.05);--sh-lg:0 12px 32px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.05);--sh-dr:-16px 0 48px rgba(0,0,0,.12);
  --toast-bg:#1a1a1a;--toast-fg:#fff;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  /* Единый вид: высота 36 / 28, радиусы 7 (элемент) · 10 (карточка, всплывающее) · 12 (окно) */
  --h:36px;--h-sm:28px;--r:7px;--r-card:10px;--r-modal:12px;
  --k:1;--dur-fast:calc(120ms*var(--k));--dur-base:calc(180ms*var(--k));--dur-slow:calc(240ms*var(--k));--dur-panel:calc(320ms*var(--k));
  --exit:.75;--stagger:calc(40ms*var(--k));
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-in-out:cubic-bezier(.77,0,.175,1);--ease-drawer:cubic-bezier(.32,.72,0,1);
  --press:.97;--pop:.96;--shift:8px;--top:49px;--ring:rgba(221,103,49,.3);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --terra-text:#e57a48;--terra-bg:rgba(221,103,49,.2);--terra-bd:rgba(221,103,49,.36);--ink:#f2f2ef;--ink-2:#d8d8d1;--ink-3:#a9aa9f;--ink-4:#7b7d74;
  --bd:rgba(255,255,255,.1);--bd-soft:rgba(255,255,255,.07);--bd-strong:rgba(255,255,255,.18);--field-bd:rgba(255,255,255,.34);
  --bg:#0f1110;--surf:#161816;--surf-2:#1c1f1c;--surf-3:#272b27;
  --good:#8cc96a;--good-bg:rgba(74,138,31,.18);--warn:#e0a84f;--warn-bg:rgba(168,106,22,.2);--info:#7ea9dd;--info-bg:rgba(44,86,135,.22);--art:#a9a3f0;--art-bg:rgba(60,52,137,.3);
  --bad:#f87171;--bad-bg:rgba(163,45,45,.18);--bad-bd:rgba(230,168,168,.3);
  --scrim:rgba(0,0,0,.62);--sh-sm:0 1px 2px rgba(0,0,0,.3);--sh-lg:0 12px 32px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.35);--sh-dr:-16px 0 48px rgba(0,0,0,.55);--toast-bg:#f2f2ef;--toast-fg:#161816}}
:root[data-theme="dark"]{color-scheme:dark;
  --terra-text:#e57a48;--terra-bg:rgba(221,103,49,.2);--terra-bd:rgba(221,103,49,.36);--ink:#f2f2ef;--ink-2:#d8d8d1;--ink-3:#a9aa9f;--ink-4:#7b7d74;
  --bd:rgba(255,255,255,.1);--bd-soft:rgba(255,255,255,.07);--bd-strong:rgba(255,255,255,.18);--field-bd:rgba(255,255,255,.34);
  --bg:#0f1110;--surf:#161816;--surf-2:#1c1f1c;--surf-3:#272b27;
  --good:#8cc96a;--good-bg:rgba(74,138,31,.18);--warn:#e0a84f;--warn-bg:rgba(168,106,22,.2);--info:#7ea9dd;--info-bg:rgba(44,86,135,.22);--art:#a9a3f0;--art-bg:rgba(60,52,137,.3);
  --bad:#f87171;--bad-bg:rgba(163,45,45,.18);--bad-bd:rgba(230,168,168,.3);
  --scrim:rgba(0,0,0,.62);--sh-sm:0 1px 2px rgba(0,0,0,.3);--sh-lg:0 12px 32px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.35);--sh-dr:-16px 0 48px rgba(0,0,0,.55);--toast-bg:#f2f2ef;--toast-fg:#161816}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font)}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--terra);outline-offset:2px}

/* Оболочка */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--top);display:flex;align-items:center;gap:14px;background:var(--bg);border-bottom:1px solid var(--bd);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.blogo{width:24px;height:24px;border-radius:6px;background:var(--terra);display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700}
.topbar .sp{flex:1}
.slow{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);white-space:nowrap}
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - var(--top))}
.panel{background:var(--surf);border-right:1px solid var(--bd);min-width:0}
.panel-in{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));padding:8px;display:flex;flex-direction:column;gap:2px}
.p-head{display:flex;align-items:center;gap:10px;padding:8px 8px 12px;font-size:13px;font-weight:600;border-bottom:1px solid var(--bd-soft);margin-bottom:6px}
.p-ic{width:22px;height:22px;border-radius:6px;background:var(--terra-bg);color:var(--terra-text);display:grid;place-items:center}
.g-label{padding:14px 11px 6px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.nl{display:flex;align-items:center;gap:11px;padding:9px 11px;border:0;background:none;border-radius:var(--r);color:var(--ink-2);text-align:left;cursor:pointer;white-space:nowrap;
  transition:background var(--dur-fast) ease,color var(--dur-fast) ease}
.nl[aria-current="page"]{background:var(--terra-bg);color:var(--terra-text);font-weight:500}
.nl .n{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.main{min-width:0}
.page{padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:901px){.page{padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}}
.page.in{animation:fade var(--dur-base) ease}
@keyframes fade{from{opacity:0}}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .panel{border-right:0;border-bottom:1px solid var(--bd)}
  .panel-in{position:static;flex-direction:row;overflow-x:auto;padding:6px max(8px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px))}
  .p-head,.g-label,.nl .n{display:none}.nl{min-height:44px;flex:none}
  .slow span{display:none}
}

/* Заголовок страницы */
.ph{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pt{font-size:22px;font-weight:600;line-height:1.25;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;text-wrap:balance}
.cnt{font-size:13px;font-weight:500;color:var(--ink-3);padding:2px 8px;background:var(--surf-3);border-radius:999px;font-variant-numeric:tabular-nums;letter-spacing:0}
.ps{font-size:13px;color:var(--ink-3);margin-top:4px}
.pa{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--h);padding:0 14px;border:1px solid transparent;border-radius:var(--r);font-size:13px;font-weight:500;line-height:1.2;cursor:pointer;white-space:nowrap;
  transition:background var(--dur-fast) ease,border-color var(--dur-fast) ease,color var(--dur-fast) ease,transform var(--dur-fast) var(--ease-out)}
.btn:active,.icb:active,.kcard:active{transform:scale(var(--press))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--terra-solid);color:#fff}
.btn-secondary{background:var(--surf);color:var(--ink);border-color:var(--bd-strong)}
.btn-ghost{background:transparent;color:var(--ink-2)}
.btn-danger{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-bd)}
.btn-sm{min-height:var(--h-sm);padding:0 10px;font-size:12.5px}
.icb{width:var(--h);height:var(--h);display:inline-grid;place-items:center;border:0;border-radius:var(--r);background:transparent;color:var(--ink-3);cursor:pointer;flex:none;
  transition:background var(--dur-fast) ease,color var(--dur-fast) ease,transform var(--dur-fast) var(--ease-out)}
.icb.sm{width:var(--h-sm);height:var(--h-sm)}
.lbl{display:inline-flex;align-items:center;gap:6px;transition:opacity var(--dur-fast) ease,filter var(--dur-fast) ease}
.swap .lbl{opacity:0;filter:blur(2px)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;flex:none}
.spin.lg{width:30px;height:30px;border-width:3px;color:var(--terra)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (hover:hover) and (pointer:fine){
  .btn-primary:hover{background:var(--terra-solid-hover)}
  .btn-secondary:hover,.btn-ghost:hover,.icb:hover,.nl:hover,.opt:hover,.preset:hover{background:var(--surf-2);color:var(--ink)}
  .btn-danger:hover{background:var(--bad-strong);color:#fff;border-color:var(--bad-strong)}
  .tbl tbody tr:hover{background:var(--surf-2)}
  .tbl tbody tr:hover .selbox{opacity:1}
  .ecard:hover,.kcard:hover{border-color:var(--bd-strong);box-shadow:var(--sh-sm)}
  .tab:hover,.seg button:hover,.ths:hover{color:var(--ink)}
  .stage:hover{filter:brightness(.97)}
}

/* Поля */
.row{display:flex;flex-direction:column;gap:5px;min-width:0}
.row>label,.row>.lab{font-size:12px;font-weight:500;color:var(--ink-2)}
.req{color:var(--terra-text);margin-left:2px}
.hint{font-size:11.5px;color:var(--ink-3)}
.err{font-size:12px;color:var(--bad);animation:fade var(--dur-base) ease}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.grid .w2{grid-column:1/-1}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}
.fld{width:100%;min-width:0;height:var(--h);padding:0 10px;border:1px solid var(--field-bd);border-radius:var(--r);background:var(--surf);color:var(--ink);font-size:13px;outline:0;
  transition:border-color var(--dur-fast) ease,box-shadow var(--dur-fast) ease}
.fld::placeholder{color:var(--ink-3)}
.fld:focus,.fbox:focus-within{border-color:var(--terra);box-shadow:0 0 0 3px var(--ring);outline:0}
.fld:disabled{opacity:.45;cursor:not-allowed}
.fld[aria-invalid="true"],.fbox[aria-invalid="true"]{border-color:var(--bad)}
.fld[aria-invalid="true"]:focus{box-shadow:0 0 0 3px var(--bad-bg)}
textarea.fld{height:auto;min-height:76px;padding:8px 10px;line-height:1.45;resize:vertical}
.static{display:flex;align-items:center;min-height:var(--h);padding:7px 10px;border:1px solid var(--bd-soft);border-radius:var(--r);background:var(--surf-2);color:var(--ink-2);font-size:13px;overflow-wrap:anywhere}
.combo{position:relative}
.combo .fld{padding-right:38px;cursor:pointer}
.combo-t{position:absolute;top:1px;right:1px;width:34px;height:calc(var(--h) - 2px);display:grid;place-items:center;border:0;border-left:1px solid var(--bd-soft);background:none;color:var(--ink-3);cursor:pointer;border-radius:0 var(--r) var(--r) 0}
.combo-t svg{transition:transform var(--dur-base) var(--ease-out)}
.combo[aria-expanded="true"] .combo-t svg{transform:rotate(180deg)}
.fbox{display:flex;flex-wrap:wrap;align-items:center;gap:5px;min-height:var(--h);padding:4px 6px;border:1px solid var(--field-bd);border-radius:var(--r);background:var(--surf);cursor:text;
  transition:border-color var(--dur-fast) ease,box-shadow var(--dur-fast) ease}
.fbox input{flex:1 1 70px;min-width:60px;height:26px;border:0;outline:0;background:none;font-size:13px}
.mchip{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:2px 4px 2px 4px;background:var(--surf-2);border-radius:999px;font-size:12px;font-weight:600;animation:popin var(--dur-base) var(--ease-out)}
.mchip .av{width:20px;height:20px;font-size:9px}
.mchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mchip button{display:grid;place-items:center;width:18px;height:18px;border:0;border-radius:50%;background:none;color:var(--ink-3);cursor:pointer;padding:0}
.mchip button svg{width:12px;height:12px}
@keyframes popin{from{opacity:0;transform:scale(var(--pop))}}
.cb{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;position:relative}
.cb input{position:absolute;opacity:0;width:18px;height:18px;margin:0;cursor:pointer}
.cb i{width:18px;height:18px;border:1px solid var(--field-bd);border-radius:5px;display:grid;place-items:center;background:var(--surf);flex:none;
  transition:background var(--dur-fast) ease,border-color var(--dur-fast) ease,transform var(--dur-fast) var(--ease-out)}
.cb:active i{transform:scale(.92)}
.cb i svg{width:12px;height:12px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:16;stroke-dashoffset:16;transition:stroke-dashoffset var(--dur-base) var(--ease-out)}
.cb input:checked+i{background:var(--terra-solid);border-color:var(--terra-solid)}
.cb input:checked+i svg{stroke-dashoffset:0}
.cb input:focus-visible+i{outline:2px solid var(--terra);outline-offset:2px}
.sw{width:38px;height:22px;border-radius:999px;border:0;background:var(--ink-4);padding:2px;cursor:pointer;flex:none;transition:background var(--dur-base) ease}
.sw i{display:block;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:var(--sh-sm);transition:transform var(--dur-slow) var(--ease-in-out)}
.sw[aria-checked="true"]{background:var(--terra-solid)}
.sw[aria-checked="true"] i{transform:translateX(16px)}
.drop{border:1.5px dashed var(--bd-strong);border-radius:var(--r-card);padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--ink-3);font-size:13px;cursor:pointer;
  transition:border-color var(--dur-fast) ease,background var(--dur-fast) ease}
.drop.over{border-color:var(--terra);background:var(--terra-bg);color:var(--terra-text)}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;border:1px solid var(--bd);border-radius:var(--r);font-size:13px;animation:rise var(--dur-slow) var(--ease-out)}
.file span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Аватар, чипы */
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:600;flex:none;background:var(--surf-3);color:var(--ink-2)}
.av.c0{background:var(--terra-bg);color:var(--terra-text)}.av.c1{background:var(--info-bg);color:var(--info)}.av.c2{background:var(--good-bg);color:var(--good)}.av.c3{background:var(--warn-bg);color:var(--warn)}.av.c4{background:var(--art-bg);color:var(--art)}
.av.lg{width:56px;height:56px;font-size:18px}.av.xs{width:22px;height:22px;font-size:9px}
.avs{display:inline-flex}.avs .av{box-shadow:0 0 0 2px var(--surf);margin-left:-6px}.avs .av:first-child{margin-left:0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--surf-3);color:var(--ink-2);white-space:nowrap;
  transition:background var(--dur-base) ease,color var(--dur-base) ease}
.chip.good{background:var(--good-bg);color:var(--good)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.info{background:var(--info-bg);color:var(--info)}.chip.tag{background:var(--terra-bg);color:var(--terra-text)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip button{display:grid;place-items:center;width:16px;height:16px;border:0;border-radius:50%;background:none;color:inherit;cursor:pointer;padding:0;margin-right:-4px;opacity:.7}
.chip button svg{width:11px;height:11px}

/* Вкладки, переключатель */
.tabs{position:relative;display:flex;gap:2px;border-bottom:1px solid var(--bd);overflow-x:auto;scrollbar-width:none}
.tab{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:0;background:none;font-size:13px;color:var(--ink-3);cursor:pointer;white-space:nowrap;transition:color var(--dur-fast) ease}
.tab[aria-selected="true"]{color:var(--ink);font-weight:500}
.tab .cnt{font-size:11px;padding:1px 6px}
.tab[aria-selected="true"] .cnt{background:var(--terra-bg);color:var(--terra-text)}
.ind{position:absolute;left:0;bottom:0;height:2px;width:100px;background:var(--terra-solid);transform-origin:left;transition:transform var(--dur-slow) var(--ease-in-out)}
.seg{position:relative;display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surf-3);border-radius:var(--r);padding:2px}
.seg button{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--h-sm);padding:0 12px;border:0;background:none;border-radius:5px;font-size:13px;color:var(--ink-3);cursor:pointer;white-space:nowrap;transition:color var(--dur-fast) ease}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/var(--n));background:var(--surf);border-radius:5px;box-shadow:var(--sh-sm);transform:translateX(calc(100%*var(--i)));transition:transform var(--dur-slow) var(--ease-in-out)}

/* Всплывающее */
.pop{position:fixed;z-index:60;background:var(--surf);border:1px solid var(--bd-strong);border-radius:var(--r-card);box-shadow:var(--sh-lg);opacity:0;transform:scale(var(--pop));pointer-events:none;max-width:calc(100vw - 16px);
  transition:opacity calc(var(--dur-base)*var(--exit)) var(--ease-out),transform calc(var(--dur-base)*var(--exit)) var(--ease-out)}
.pop[data-open]{opacity:1;transform:none;pointer-events:auto;transition-duration:var(--dur-base)}
.menu{padding:4px;max-height:260px;overflow:auto;min-width:180px}
.opt{width:100%;min-height:34px;display:flex;align-items:center;gap:10px;padding:6px 8px;border:0;border-radius:5px;background:none;text-align:left;font-size:13px;cursor:pointer;transition:background var(--dur-fast) ease}
.opt[data-act]{background:var(--surf-2);box-shadow:inset 0 0 0 1px var(--bd-strong)}
.opt .i:last-child{margin-left:auto;color:var(--terra-text)}
.opt.danger{color:var(--bad)}
.menu-sep{height:1px;margin:4px;background:var(--bd-soft)}
.menu-empty{padding:9px 8px;color:var(--ink-3);font-size:13px}
.cal{padding:10px;width:252px}
.cal-h{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:13px;padding-bottom:6px;text-transform:capitalize}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums}
.cal-g span{color:var(--ink-3);padding:4px 0;font-size:11px}

.banner>span{flex:1;min-width:0}.banner.info{background:var(--info-bg)}.banner.info>.i{color:var(--info)}.banner.warn{background:var(--warn-bg)}.banner.warn>.i{color:var(--warn)}

  .pill.top{min-width:0;padding:0 10px;margin-left:4px}.pill.top span,.pill.top kbd,.brand span:last-child{display:none}

  .panel-in{overflow:visible;padding:4px max(4px,env(safe-area-inset-right,0px)) 4px max(4px,env(safe-area-inset-left,0px));gap:0}

    transition:transform calc(var(--dur-panel)*var(--exit)) var(--ease-drawer)}

}

  ${L('Что уже учтено в этом макете',['Одна высота элементов — 36 и 28 px; радиусы по ролям — 7 (элемент), 10 (карточка, меню), 12 (окно).','Одна рамка 1 px, один вид фокуса, один счётчик, один аватар, одно меню, одно окно.','Основная кнопка и текущая стадия — на тёмном терракоте с контрастом 4,99.','Шесть видов движения из прошлого предложения применены ко всем элементам; выход всегда на четверть быстрее входа.','Канбан: цветная полоса сверху заменена точкой перед названием колонки.'])}

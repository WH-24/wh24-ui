<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wowhaus Wiki — Изображения</title>
  <meta name="description" content="UI mockup of the image browser with masonry grid and detail drawer." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --terra: #dd6731;
      --terra-d: #b8501f;
      --terra-bg: #fbeee5;
      --terra-bd: #e89971;

      --ink: #1a1a1a;
      --ink-2: #3d3d3d;
      --ink-3: #7a7a7a;
      --ink-4: #b4b2a9;
      --ink-5: #c0bdb3;

      --bd: rgba(0, 0, 0, 0.08);
      --bd-soft: rgba(0, 0, 0, 0.05);
      --bd-strong: rgba(0, 0, 0, 0.12);

      --bg: #fafaf7;
      --surf: #ffffff;
      --surf-2: #f7f5f0;
      --surf-3: #efece4;

      --tp-proj: #8e3a14;
      --tp-std: #444441;
      --tp-sol: #0c447c;
      --tp-art: #3c3489;

      --font-sans: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --font-mono: ui-monospace, 'SF Mono', Monaco, Consolas, monospace;

      --r-sm: 5px;
      --r-md: 7px;
      --r-lg: 10px;
      --r-xl: 12px;
      --r-pill: 999px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a { color: inherit; text-decoration: none; }
    button {
      font-family: inherit; font-size: inherit; color: inherit;
      background: none; border: none; padding: 0; cursor: pointer;
    }
    input { font-family: inherit; font-size: inherit; color: inherit; }

    :focus-visible {
      outline: 2px solid var(--terra);
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* Top bar */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 32px;
      border-bottom: 0.5px solid var(--bd);
      background: rgba(250, 250, 247, 0.85);
      backdrop-filter: saturate(180%) blur(8px);
      position: sticky; top: 0; z-index: 30;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .blogo {
      width: 24px; height: 24px; border-radius: 6px;
      background: var(--terra); position: relative; flex-shrink: 0;
    }
    .blogo::after {
      content: ''; position: absolute; inset: 5px 5px 9px 5px;
      border: 1.5px solid #fff; border-bottom: none; border-radius: 1px 1px 0 0;
    }
    .blogo::before {
      content: ''; position: absolute; bottom: 5px; left: 5px; right: 5px;
      height: 1.5px; background: #fff; border-radius: 1px;
    }
    .bname { font-weight: 600; font-size: 14px; color: var(--ink); letter-spacing: -0.01em; }
    .pill {
      display: inline-flex; align-items: center; gap: 9px;
      padding: 8px 14px; background: var(--surf);
      border: 0.5px solid var(--bd-strong); border-radius: var(--r-pill);
      font-size: 13px; color: var(--ink-3); min-width: 280px; cursor: pointer;
      transition: border-color .15s;
    }
    .pill:hover { border-color: var(--terra-bd); }
    .pill .pill-i { color: var(--terra); }
    .pill kbd {
      margin-left: auto; font-family: var(--font-mono); font-size: 11px;
      background: var(--surf-2); border: 0.5px solid var(--bd);
      border-radius: 4px; padding: 1px 6px; color: var(--ink-2);
    }
    .tr { display: flex; align-items: center; gap: 10px; }
    .icon-btn {
      width: 32px; height: 32px; border-radius: 6px;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--ink-3); font-size: 14px; cursor: pointer;
      transition: background .15s, color .15s;
    }
    .icon-btn:hover { background: var(--surf-2); color: var(--ink); }
    .av {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--surf-3); display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 500; color: var(--ink-2); cursor: pointer;
    }

    /* Page */
    .page { max-width: 1400px; margin: 0 auto; padding: 24px 32px 40px; }

    .ph {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 16px; margin-bottom: 22px;
    }
    .ph-l { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--ink-3); padding: 4px 8px 4px 4px;
      border-radius: var(--r-sm); align-self: flex-start; font-weight: 500;
      transition: color .15s, background .15s; margin-left: -4px;
    }
    .back-btn:hover { color: var(--ink); background: var(--surf-2); }
    .ph-h {
      font-size: 26px; font-weight: 600; color: var(--ink);
      letter-spacing: -0.02em; line-height: 1.1;
    }
    .ph-meta { font-size: 12px; color: var(--ink-3); }
    .ph-meta b { color: var(--ink); font-weight: 600; }
    .ph-upload {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 16px; background: var(--ink); color: #fff;
      border-radius: var(--r-md); font-size: 13px; font-weight: 500;
      flex-shrink: 0; transition: background .15s;
    }
    .ph-upload:hover { background: #000; }

    /* Search bar */
    .search-bar {
      display: flex; gap: 10px; align-items: center; margin-bottom: 14px;
    }
    .search-input {
      flex: 1; display: flex; align-items: center; gap: 9px;
      padding: 10px 14px; background: var(--surf);
      border: 0.5px solid var(--bd-strong); border-radius: var(--r-lg);
      font-size: 13px; color: var(--ink); transition: border-color .15s;
    }
    .search-input:focus-within { border-color: var(--terra); }
    .search-input input {
      flex: 1; border: none; outline: none; background: transparent;
      color: var(--ink); font-size: 13px;
    }
    .search-input input::placeholder { color: var(--ink-3); }
    .seg {
      display: flex; background: var(--surf-2);
      border-radius: var(--r-md); padding: 2px;
    }
    .seg-btn {
      padding: 6px 14px; font-size: 12px; color: var(--ink-3);
      border-radius: 5px; font-weight: 500; transition: color .15s;
    }
    .seg-btn:hover { color: var(--ink); }
    .seg-btn.on {
      background: var(--surf); color: var(--ink);
      box-shadow: 0 0 0 0.5px var(--bd-strong);
    }

    /* Filter bar */
    .filter-bar {
      display: flex; align-items: center; gap: 4px;
      margin-bottom: 14px; flex-wrap: wrap;
      padding-bottom: 14px; border-bottom: 0.5px solid var(--bd-soft);
    }
    .fb-btn {
      padding: 6px 11px; font-size: 12px; color: var(--ink-2);
      border-radius: var(--r-sm); display: inline-flex;
      align-items: center; gap: 5px; font-weight: 500;
      transition: background .15s, color .15s;
    }
    .fb-btn:hover { background: var(--surf-2); color: var(--ink); }
    .fb-btn.has { color: var(--ink); }
    .fb-btn.has::after {
      content: ''; width: 5px; height: 5px;
      background: var(--terra); border-radius: 50%; margin-left: 1px;
    }
    .fb-btn .arr { font-size: 8px; opacity: .5; }
    .fb-sep { width: 1px; height: 12px; background: var(--bd); margin: 0 2px; }
    .fb-spacer { flex: 1; }
    .fb-sort {
      padding: 6px 11px; font-size: 12px; color: var(--ink-2);
      border-radius: var(--r-sm); display: inline-flex;
      align-items: center; gap: 5px; font-weight: 500;
      background: var(--surf-2); transition: background .15s;
    }
    .fb-sort:hover { background: var(--surf-3); color: var(--ink); }
    .density-toggle {
      display: flex; background: var(--surf-2);
      border-radius: var(--r-md); padding: 2px;
    }
    .dt-btn {
      padding: 5px 10px; font-size: 11px; color: var(--ink-3);
      border-radius: 4px; font-weight: 500; transition: color .15s;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .dt-btn:hover { color: var(--ink); }
    .dt-btn.on {
      background: var(--surf); color: var(--ink);
      box-shadow: 0 0 0 0.5px var(--bd-strong);
    }

    /* Tag chips active */
    .chips {
      display: flex; align-items: center; gap: 7px;
      padding: 0 0 14px; flex-wrap: wrap;
    }
    .chips:empty { display: none; }
    .chips-l {
      font-size: 10px; letter-spacing: .04em; text-transform: uppercase;
      color: var(--ink-4); font-weight: 500; margin-right: 4px;
    }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; font-size: 11px;
      background: var(--terra-bg); color: var(--tp-proj);
      border: 0.5px solid var(--terra-bd);
      border-radius: var(--r-pill); font-weight: 500;
    }
    .chip-x {
      opacity: .5; cursor: pointer; font-size: 13px;
      line-height: 1; transition: opacity .15s;
    }
    .chip-x:hover { opacity: 1; }
    .fb-clr {
      font-size: 11px; color: var(--terra-d); padding: 4px 8px;
      border-radius: var(--r-sm); font-weight: 500;
    }
    .fb-clr:hover { background: var(--terra-bg); }

    /* Masonry grid via CSS columns */
    .masonry {
      column-count: 5;
      column-gap: 12px;
      transition: column-count .2s;
    }
    .masonry.dense  { column-count: 6; column-gap: 10px; }
    .masonry.cozy   { column-count: 4; column-gap: 14px; }

    .img-card {
      break-inside: avoid;
      margin-bottom: 12px;
      border-radius: var(--r-lg);
      overflow: hidden;
      background: var(--surf-2);
      cursor: pointer;
      position: relative;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .masonry.dense .img-card,
    .masonry.cozy .img-card { margin-bottom: var(--gap, 12px); }
    .img-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, .07);
    }
    .img-card.active {
      box-shadow: 0 0 0 2px var(--terra), 0 6px 18px rgba(0, 0, 0, .09);
    }
    .img-thumb {
      width: 100%; display: block;
      background: var(--surf-3);
    }

    /* Hover overlay */
    .img-ov {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 50%);
      opacity: 0;
      transition: opacity .18s ease;
      pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 10px;
    }
    .img-card:hover .img-ov { opacity: 1; pointer-events: auto; }
    .img-ov-top {
      display: flex; justify-content: flex-end; gap: 5px;
    }
    .img-ov-btn {
      width: 28px; height: 28px; border-radius: var(--r-sm);
      background: rgba(255,255,255,0.95);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 13px; color: var(--ink); cursor: pointer;
      transition: background .15s, transform .15s;
    }
    .img-ov-btn:hover { background: #fff; transform: scale(1.05); }
    .img-ov-btn.primary {
      background: var(--ink); color: #fff;
    }
    .img-ov-btn.primary:hover { background: #000; }
    .img-ov-bottom {
      display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
    }
    .img-ov-tag {
      font-size: 10px; padding: 3px 7px;
      background: rgba(255,255,255,0.22);
      backdrop-filter: blur(4px);
      color: #fff; border-radius: 3px;
      font-weight: 500;
    }

    /* Empty / loading */
    .res-meta {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 14px;
    }
    .res-cnt { font-size: 12px; color: var(--ink-3); }
    .res-cnt b { color: var(--ink); font-weight: 600; }

    .more { text-align: center; padding: 24px 0 6px; }
    .more-btn {
      padding: 8px 20px; background: var(--surf);
      border: 0.5px solid var(--bd-strong); border-radius: var(--r-md);
      font-size: 13px; color: var(--ink-2); font-weight: 500;
    }
    .more-btn:hover { border-color: var(--terra-bd); color: var(--ink); }
    .more-meta { font-size: 11px; color: var(--ink-4); margin-top: 7px; }

    /* Drawer */
    .drawer-scrim {
      position: fixed; inset: 0;
      background: rgba(26, 26, 26, 0.5);
      opacity: 0; pointer-events: none;
      transition: opacity .25s ease;
      z-index: 40;
    }
    .drawer-scrim.open { opacity: 1; pointer-events: auto; }

    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: min(960px, 90vw);
      background: var(--bg);
      transform: translateX(100%);
      transition: transform .28s cubic-bezier(.32, .72, 0, 1);
      z-index: 50;
      display: grid; grid-template-columns: 1fr 320px;
      overflow: hidden;
    }
    .drawer.open { transform: translateX(0); }

    .drawer-photo {
      background: #1a1a1a;
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    .drawer-photo img,
    .drawer-photo .photo-fallback {
      max-width: 100%; max-height: 100%;
      width: 100%; height: 100%;
      object-fit: contain;
      display: block;
    }
    .drawer-photo .photo-fallback {
      background: linear-gradient(135deg, var(--c1, #e89971), var(--c2, #fbeee5));
    }
    .drawer-nav {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.9);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: var(--ink);
      cursor: pointer;
      transition: background .15s, transform .15s;
    }
    .drawer-nav:hover { background: #fff; transform: translateY(-50%) scale(1.05); }
    .drawer-nav.prev { left: 16px; }
    .drawer-nav.next { right: 16px; }
    .drawer-counter {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      padding: 5px 12px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      color: #fff;
      border-radius: var(--r-pill);
      font-size: 11px; font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    .drawer-side {
      background: var(--surf);
      border-left: 0.5px solid var(--bd);
      overflow-y: auto;
      display: flex; flex-direction: column;
    }
    .drawer-head {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 18px 20px 14px;
      border-bottom: 0.5px solid var(--bd-soft);
    }
    .drawer-h {
      font-size: 15px; font-weight: 600; color: var(--ink);
      line-height: 1.3; letter-spacing: -0.005em;
    }
    .drawer-close {
      width: 28px; height: 28px; border-radius: var(--r-sm);
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--ink-3); font-size: 16px; flex-shrink: 0;
      transition: background .15s, color .15s;
    }
    .drawer-close:hover { background: var(--surf-2); color: var(--ink); }

    .drawer-body { padding: 16px 20px; flex: 1; }
    .drawer-section { margin-bottom: 22px; }
    .drawer-section:last-child { margin-bottom: 0; }
    .drawer-sec-h {
      font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
      color: var(--ink-4); font-weight: 500; margin-bottom: 10px;
    }
    .drawer-desc {
      font-size: 13px; color: var(--ink-2); line-height: 1.55;
    }
    .drawer-source {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      background: var(--surf-2);
      border-radius: var(--r-md);
      transition: background .15s;
    }
    .drawer-source:hover { background: var(--surf-3); }
    .drawer-source-icon {
      width: 32px; height: 32px; border-radius: var(--r-sm);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 13px; flex-shrink: 0;
    }
    .drawer-source-icon.proj { background: var(--terra-bg); color: var(--tp-proj); }
    .drawer-source-icon.std { background: var(--surf-3); color: var(--tp-std); }
    .drawer-source-icon.sol { background: #e6f1fb; color: var(--tp-sol); }
    .drawer-source-icon.art { background: #eeedfe; color: var(--tp-art); }
    .drawer-source-text { flex: 1; min-width: 0; }
    .drawer-source-tag {
      font-size: 10px; letter-spacing: .04em; text-transform: uppercase;
      font-weight: 500; color: var(--ink-3);
    }
    .drawer-source-name {
      font-size: 13px; font-weight: 500; color: var(--ink);
      margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .drawer-source-arr { color: var(--ink-3); font-size: 14px; flex-shrink: 0; }

    .drawer-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .drawer-tag {
      font-size: 11px; padding: 4px 10px;
      background: var(--terra-bg); color: var(--tp-proj);
      border: 0.5px solid var(--terra-bd);
      border-radius: var(--r-pill); font-weight: 500;
    }

    .drawer-meta-row {
      display: flex; justify-content: space-between;
      padding: 7px 0;
      border-bottom: 0.5px solid var(--bd-soft);
      font-size: 12px;
    }
    .drawer-meta-row:last-child { border-bottom: none; }
    .drawer-meta-l { color: var(--ink-3); }
    .drawer-meta-v { color: var(--ink); font-weight: 500; }

    .drawer-actions {
      padding: 14px 20px;
      border-top: 0.5px solid var(--bd-soft);
      display: flex; gap: 8px;
      background: var(--bg);
      position: sticky; bottom: 0;
    }
    .drawer-act {
      flex: 1;
      padding: 8px 12px;
      background: var(--surf);
      border: 0.5px solid var(--bd-strong);
      border-radius: var(--r-md);
      font-size: 12px; font-weight: 500; color: var(--ink-2);
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .drawer-act:hover { border-color: var(--terra-bd); color: var(--ink); }
    .drawer-act.primary {
      background: var(--ink); color: #fff; border-color: var(--ink);
    }
    .drawer-act.primary:hover { background: #000; }

    @media (max-width: 1100px) {
      .masonry { column-count: 4; }
      .masonry.dense { column-count: 5; }
      .masonry.cozy { column-count: 3; }
    }
    @media (max-width: 800px) {
      .masonry { column-count: 3; }
      .masonry.dense { column-count: 4; }
      .masonry.cozy { column-count: 2; }
      .drawer { grid-template-columns: 1fr; }
      .drawer-photo { height: 50vh; min-height: 280px; }
    }
    @media (max-width: 540px) {
      .topbar { padding: 12px 18px; }
      .pill { min-width: 0; flex: 1; }
      .pill kbd { display: none; }
      .page { padding: 18px 18px 28px; }
      .ph { flex-direction: column; align-items: stretch; }
      .ph-upload { align-self: flex-start; }
      .search-bar { flex-direction: column; align-items: stretch; }
      .seg { align-self: flex-start; }
      .masonry { column-count: 2; }
      .masonry.dense { column-count: 3; }
      .masonry.cozy { column-count: 2; }
    }
  
    /* === Dark theme tokens (matched with styleguide) === */
    html[data-theme="dark"]{color-scheme:dark;--bg:#0f1110;--surf:#161816;--surf-2:#1c1f1c;--surf-3:#272b27;--ink:#f2f2ef;--ink-2:#d8d8d1;--ink-3:#a9aa9f;--ink-4:#7b7d74;--ink-5:#5d5f58;--bd:rgba(255,255,255,0.10);--bd-soft:rgba(255,255,255,0.07);--bd-strong:rgba(255,255,255,0.16);--terra-bg:rgba(221,103,49,0.20);--terra-bd:rgba(221,103,49,0.36);--good-bg:rgba(74,138,31,0.18);--good-bd:rgba(185,212,145,0.30);--warn-bg:rgba(168,106,22,0.20);--warn-bd:rgba(226,191,128,0.30);--info-bg:rgba(44,86,135,0.20);--info-bd:rgba(196,211,230,0.28);--bad-bg:rgba(163,45,45,0.18);--bad-bd:rgba(230,168,168,0.30)}
    html[data-theme="dark"] .topbar,html[data-theme="dark"] .edit-toolbar{background:rgba(15,17,16,0.85)}
    html[data-theme="dark"] .behind{background:linear-gradient(135deg,#15110d 0%,#1c1f1c 35%,#0f1110 65%,#272b27 100%);filter:blur(2px) saturate(0.9)}
    html[data-theme="dark"] .behind-bar,html[data-theme="dark"] .behind-card,html[data-theme="dark"] .behind-grid > div{background:var(--surf)}

  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="hub-mockup.html" aria-label="На главную">
      <span class="blogo" aria-hidden="true"></span>
      <span class="bname">Wowhaus</span>
    </a>
    <a href="cmdk-mockup.html" class="pill" aria-label="Открыть палитру команд">

    // Aspect ratio constants for thumbnail SVG
    const masonry = document.getElementById('masonry');
    const drawer = document.getElementById('drawer');
    const scrim = document.getElementById('scrim');
    let activeIndex = -1;

    // Render a placeholder SVG thumbnail with gradient and a subtle architectural-ish overlay
    function renderThumb(p) {
      const w = 400;
      const h = p.h;
      // simple gradient + line decoration so cards aren't pure flats
      const lines = [];
      const lineCount = 6;
      for (let i = 0; i < lineCount; i++) {
        const y = (h / lineCount) * (i + 0.5);
        const x1 = Math.random() * w * 0.3;
        const x2 = w - Math.random() * w * 0.3;
        lines.push(`<line x1="${x1.toFixed(0)}" y1="${y.toFixed(0)}" x2="${x2.toFixed(0)}" y2="${y.toFixed(0)}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>`);
      }
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" class="img-thumb" preserveAspectRatio="xMidYMid slice" style="aspect-ratio:${w}/${h};display:block;width:100%">
          <defs>
            <linearGradient id="g${p.id}" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="${p.c1}"/>
              <stop offset="100%" stop-color="${p.c2}"/>
            </linearGradient>
          </defs>
          <rect width="${w}" height="${h}" fill="url(#g${p.id})"/>
          ${lines.join('')}
        </svg>`;
      return svg;
    }

    function renderMasonry() {
      masonry.innerHTML = PHOTOS.map((p, i) => `
        <article class="img-card" data-i="${i}" data-id="${p.id}">
          ${renderThumb(p)}
          <div class="img-ov">
            <div class="img-ov-top">
              <button class="img-ov-btn" title="Сохранить в коллекцию" data-act="save">★</button>
              <button class="img-ov-btn" title="Копировать ссылку" data-act="copy">⎘</button>
              <button class="img-ov-btn primary" title="Открыть статью" data-act="open">↗</button>
            </div>
            <div class="img-ov-bottom">
              ${p.tags.slice(0, 3).map(t => `<span class="img-ov-tag">#${t}</span>`).join('')}
            </div>
          </div>
        </article>
      `).join('');

      // Click handlers — clicks on the card open drawer; clicks on overlay buttons are stubbed.
      masonry.querySelectorAll('.img-card').forEach(card => {
        card.addEventListener('click', e => {
          if (e.target.closest('[data-act]')) {
            e.stopPropagation();
            return; // overlay actions don't open drawer
          }
          openDrawer(parseInt(card.dataset.i, 10));
        });
      });
    }

    // Drawer logic
    function openDrawer(idx) {
      if (idx < 0 || idx >= PHOTOS.length) return;
      activeIndex = idx;
      const p = PHOTOS[idx];

      // Visual indicator on card
      masonry.querySelectorAll('.img-card').forEach(c => c.classList.remove('active'));
      masonry.querySelector(`.img-card[data-i="${idx}"]`)?.classList.add('active');

      // Photo area: replicate the same gradient look as the thumb at full size
      document.getElementById('drawerPhoto').style.setProperty('--c1', p.c1);
      document.getElementById('drawerPhoto').style.setProperty('--c2', p.c2);
      // Replace photo content (keep nav buttons)
      const photoEl = document.getElementById('drawerPhoto');
      // remove existing fallback if present
      photoEl.querySelectorAll('.photo-fallback').forEach(el => el.remove());
      const fb = document.createElement('div');
      fb.className = 'photo-fallback';
      fb.style.background = `linear-gradient(135deg, ${p.c1} 0%, ${p.c2} 100%)`;
      photoEl.insertBefore(fb, photoEl.firstChild);

      document.getElementById('drawerTitle').textContent = p.title;
      document.getElementById('drawerDesc').textContent = p.desc;

      const srcIcon = document.getElementById('drawerSrcIcon');
      srcIcon.className = 'drawer-source-icon ' + p.src.type;
      srcIcon.textContent = { proj: '▤', std: '⬚', sol: '◇', art: '¶' }[p.src.type] || '▤';
      document.getElementById('drawerSrcTag').textContent = p.src.tag;
      document.getElementById('drawerSrcName').textContent = p.src.name;

      document.getElementById('drawerTags').innerHTML = p.tags
        .map(t => `<span class="drawer-tag">#${t}</span>`).join('');

      document.getElementById('drawerFile').textContent = p.file;
      document.getElementById('drawerSize').textContent = p.size;
      document.getElementById('drawerUploaded').textContent = p.uploaded;
      document.getElementById('drawerAuthor').textContent = p.author;

      document.getElementById('drawerCounter').textContent = `${idx + 1} / ${PHOTOS.length}`;

      drawer.classList.add('open');
      drawer.setAttribute('aria-hidden', 'false');
      scrim.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeDrawer() {
      drawer.classList.remove('open');
      drawer.setAttribute('aria-hidden', 'true');
      scrim.classList.remove('open');
      document.body.style.overflow = '';
      masonry.querySelectorAll('.img-card').forEach(c => c.classList.remove('active'));
      activeIndex = -1;
    }

    function navDrawer(dir) {
      if (activeIndex < 0) return;
      const next = (activeIndex + dir + PHOTOS.length) % PHOTOS.length;
      openDrawer(next);
      // scroll the active card into view if user navigates by keyboard far away
      const card = masonry.querySelector(`.img-card[data-i="${next}"]`);
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    document.getElementById('drawerClose').addEventListener('click', closeDrawer);
    document.getElementById('navPrev').addEventListener('click', e => { e.stopPropagation(); navDrawer(-1); });
    document.getElementById('navNext').addEventListener('click', e => { e.stopPropagation(); navDrawer(1); });
    scrim.addEventListener('click', closeDrawer);

    document.addEventListener('keydown', e => {
      if (!drawer.classList.contains('open')) return;
      if (e.key === 'Escape') closeDrawer();
      else if (e.key === 'ArrowRight') navDrawer(1);
      else if (e.key === 'ArrowLeft') navDrawer(-1);
    });

    // Density toggle
    document.querySelectorAll('.dt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.dt-btn').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        masonry.classList.remove('dense', 'cozy');
        const d = btn.dataset.dens;
        if (d === 'dense') masonry.classList.add('dense');
        else if (d === 'cozy') masonry.classList.add('cozy');
      });
    });

    // Search filter (filters cards by title/desc/tags)
    const searchIn = document.getElementById('searchIn');
    const resVisible = document.getElementById('resVisible');
    function pluralize(n) {
      const m = n % 10, h = n % 100;
      if (h >= 11 && h <= 19) return 'изображений';
      if (m === 1) return 'изображение';
      if (m >= 2 && m <= 4) return 'изображения';
      return 'изображений';
    }
    function applySearch() {
      const q = (searchIn.value || '').toLowerCase().trim();
      let visible = 0;
      masonry.querySelectorAll('.img-card').forEach(card => {
        const idx = parseInt(card.dataset.i, 10);
        const p = PHOTOS[idx];
        const haystack = (p.title + ' ' + p.desc + ' ' + p.tags.join(' ') + ' ' + p.src.name).toLowerCase();
        const show = !q || haystack.includes(q);
        card.style.display = show ? '' : 'none';
        if (show) visible++;
      });
      resVisible.textContent = `${visible} ${pluralize(visible)}`;
    }
    searchIn.addEventListener('input', applySearch);

    // Active chips removal (just visual stubs in the mockup)
    document.querySelectorAll('.chip-x').forEach(x => {
      x.addEventListener('click', e => {
        e.target.closest('.chip').remove();
        const remaining = document.querySelectorAll('#chips .chip').length;
        if (!remaining) document.getElementById('chips').innerHTML = '';
      });
    });
    document.getElementById('clrAll')?.addEventListener('click', () => {
      document.getElementById('chips').innerHTML = '';
    });

    // Init
    renderMasonry();
    applySearch();
  
    // === Dark theme toggle (shared key: wh-theme) ===
    (function(){
      var KEY='wh-theme', root=document.documentElement;
      function applyTheme(t){
        if(t==='dark') root.setAttribute('data-theme','dark');
        else root.removeAttribute('data-theme');
        document.querySelectorAll('[data-theme-toggle], .icon-btn[aria-label="Переключить тему"]').forEach(function(b){b.classList.toggle('on', t==='dark')});
      }
      applyTheme(localStorage.getItem(KEY) || 'light');
      document.querySelectorAll('[data-theme-toggle], .icon-btn[aria-label="Переключить тему"]').forEach(function(b){
        b.addEventListener('click', function(){
          var next = root.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
          localStorage.setItem(KEY, next);
          applyTheme(next);
        });
      });
    })();

  </script>
</body>
</html>
